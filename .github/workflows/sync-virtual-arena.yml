name: Sync UNC Futbol League data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5,11,17,23 * * *'

permissions:
  contents: write

concurrency:
  group: virtual-arena-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Sync UFL Season 2 divisions
        run: node scripts/sync-virtual-arena.mjs
      - name: Publish changed league data
        run: |
          if git diff --quiet -- pickems-app/season-data.js pickems-app/seasons pickems-app/season-data-6v6-s2.json pickems-app/season-data-10v10-s2.json pickems-app/season-data-6v6-s2.js pickems-app/season-data-10v10-s2.js; then
            echo "UNC Futbol League data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pickems-app/season-data.js pickems-app/seasons pickems-app/season-data-6v6-s2.json pickems-app/season-data-10v10-s2.json pickems-app/season-data-6v6-s2.js pickems-app/season-data-10v10-s2.js
          git commit -m "Sync UFL Season 2 Virtual Arena data"
          git push
