name: Verify UFB website

on:
  push:
    branches: [master, 'codex/ux-*']
  pull_request:
    branches: [master]

jobs:
  guard-ufb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep the UFB documentation published
        run: node scripts/check-ufb.mjs
      - name: Verify website behavior, access controls, and games
        run: node --test scripts/*.test.mjs mountain-app/tests/*.test.mjs
      - name: Build public-only website
        run: node scripts/build-public.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ufl-site-${{ github.sha }}
          path: |
            dist/
            functions/
            wrangler.toml
