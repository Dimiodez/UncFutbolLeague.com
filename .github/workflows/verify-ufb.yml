name: Verify UFB website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  guard-ufb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep the UFB documentation published
        run: node scripts/check-ufb.mjs
      - name: Verify private team hubs and publication assets
        run: node --test scripts/live-team-hub.test.mjs scripts/team-hub-ux.test.mjs scripts/publication.test.mjs scripts/auth-security.test.mjs scripts/league-rosters.test.mjs
