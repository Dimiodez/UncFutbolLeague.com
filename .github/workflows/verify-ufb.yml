name: Verify UFB website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  guard-ufb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Keep the UFB documentation published
        run: node scripts/check-ufb.mjs
