name: EA hosted feed
on:
  workflow_dispatch:
    inputs:
      preflight:
        description: Read-only EA access check; do not ingest or change results
        type: boolean
        default: false
      clubs:
        description: JSON array of EA club IDs for the read-only preflight
        type: string
        default: "[]"
      monitor:
        description: Keep polling every five minutes until 06:55 UTC
        type: boolean
        default: true
  push:
    branches: [master]
    paths: ['.github/workflows/ea-hosted-feed.yml']
  workflow_run:
    workflows: ['Sync UNC Futbol League data']
    types: [completed]
    branches: [master]
  schedule:
    # UTC coverage for Tuesday/Thursday Central matchnights, including DST.
    # Independent retry starts: a missed job must not lose an entire matchnight.
    - cron: '7,17,27,37,47,57 0-7 * * 3,5'
  pull_request:
    paths:
      - '.github/workflows/ea-hosted-feed.yml'
      - 'scripts/collect-ea-hosted.mjs'
      - 'league-collectors/**'
      - 'league-suite-runtime/functions/_lib/ea-hosted-feed.js'
permissions:
  contents: read
jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check all requested clubs through the hosted EA route without writing results
        env:
          EA_PREFLIGHT_CLUBS: ${{ inputs.clubs }}
        run: node scripts/preflight-ea-hosted.mjs
  transport-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify EA friendly access from hosted runner
        run: |
          node --input-type=module <<'JS'
          import {readMatchType} from './league-suite-runtime/functions/_lib/ea-match-feed.js';
          const result=await readMatchType('1236403','friendly','friendlyMatch');
          console.log(JSON.stringify({available:result.available,source:result.source,matches:result.matches.length,attempts:result.attempts}));
          if(!result.available||result.source!=='EA direct')process.exitCode=1;
          JS
  collect:
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.preflight)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: ea-hosted-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Supply current EA friendly responses to Cloudflare
        env:
          EA_FEED_INGEST_KEY: ${{ secrets.EA_FEED_INGEST_KEY }}
          EA_FEED_MONITOR: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.monitor) }}
        run: node scripts/collect-ea-hosted.mjs
